<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Países com Favoritos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Explorador de Países</h1>
      <p>Pesquise países e guarde os seus favoritos no banco de dados.</p>
    </header>
    
    <main>
      <div class="busca-area">
        <input type="text" id="campo-busca" placeholder="Ex: Brazil, Japan, France...">
        <button id="botao-buscar">Buscar</button>
      </div>

      <div id="resultado" class="resultado-area"></div>

      <hr class="divisor">

      <section class="favoritos-secao">
        <h2>⭐ Os Meus Países Favoritos</h2>
        <ul id="lista-favoritos" class="lista-favoritos"></ul>
      </section>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
