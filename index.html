<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Países</title>
    <!-- Adicionando o Pico.css para um estilo base bonito -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <hgroup>
                <h1>Explorador de Países 🌍</h1>
                <h2>Descubra informações sobre qualquer país do mundo</h2>
            </hgroup>
        </header>

        <section class="busca-container">
            <input type="text" id="campo-busca" placeholder="Digite o nome do país em inglês (ex: Brazil, Japan)...">
            <button id="botao-buscar">Buscar</button>
        </section>

        <!-- Aqui é onde os resultados ou erros vão aparecer -->
        <section id="resultado" class="resultado-container">
            <!-- Vazio inicialmente -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
